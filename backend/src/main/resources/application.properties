spring.application.name=viacar
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=viacar
spring.flyway.default-schema=viacar
spring.flyway.schemas=viacar
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
app.login-limit=${APP_LOGIN_LIMIT:10}
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/docs
